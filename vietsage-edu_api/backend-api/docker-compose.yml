services:
  postgres:
    image: postgres:16-alpine
    container_name: vietsage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vietsage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vietsage_dev_password}
      POSTGRES_DB: vietsage_edu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vietsage -d vietsage_edu"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: vietsage-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vietsage:${POSTGRES_PASSWORD:-vietsage_dev_password}@postgres:5432/vietsage_edu?schema=public
      LOG_DIR: /app/logs
    volumes:
      - ../backend-logs:/app/logs
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
